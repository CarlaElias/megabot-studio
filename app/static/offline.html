<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#101117">
 <title>MegaBot · Sin conexión</title>
 <style>
 :root{color-scheme:dark}
 *{box-sizing:border-box}
 body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b0d13;color:#f7f9ff;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
 .card{max-width:430px;border:1px solid #343a49;background:#181e2b;border-radius:24px;padding:30px;text-align:center;box-shadow:0 22px 70px #03060c80}
 .symbol{display:grid;place-items:center;font-size:42px;width:80px;height:80px;margin:auto auto 18px;background:#e9b65a1f;border-radius:20px}
 h1{font-size:26px;margin:0 0 8px}p{color:#acb7cc;margin:0 0 20px}
 button{border:0;border-radius:12px;background:#ef415a;color:white;font:700 16px system-ui;padding:14px 22px;width:100%;min-height:48px;cursor:pointer}
 small{display:block;color:#a3acc0;margin-top:16px}
 </style>
</head>
<body><main class="card">
 <div class="symbol" aria-hidden="true">📴</div>
 <h1>Sin conexión a Internet</h1>
 <p>MegaBot necesita Internet para consultar inventarios, precios y ventas actualizados. No se muestran datos antiguos para evitar errores.</p>
 <button type="button" onclick="location.reload()">Volver a intentar</button>
 <small>Cuando se restablezca la conexión, ingresa con tu cuenta habitual.</small>
</main></body></html>
